name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      # Ubuntu runners don't hit the workerd/Application-Control issue that
      # blocks this locally on Windows (docs/DECISIONS.md ADR-008) -- CI is
      # where local D1 migrations actually get verified for now.
      - name: Apply D1 migrations (local, ephemeral)
        working-directory: apps/ingest
        run: pnpm exec wrangler d1 migrations apply fuel-price-db --local
