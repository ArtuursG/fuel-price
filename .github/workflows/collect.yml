name: Collect

on:
  # The fuel-price-ingest Worker starts this every 30 minutes through the API
  # (apps/ingest/src/collect-trigger.ts): scope "fuel", or "all" once a day.
  # A manual run from the Actions tab collects everything by default.
  workflow_dispatch:
    inputs:
      scope:
        description: "What to collect"
        type: choice
        options: [all, fuel]
        default: all
  # GitHub's own schedule is only a fallback: for this repository it fires
  # every few hours instead of every 30 minutes.
  schedule:
    # Fuel prices: 7,37 * * * * per docs/PROMPT_START.md. Enabled on
    # 2026-09-20, once INGEST_URL pointed at the real ingest Worker and all
    # five fuel sources were working in production.
    # Load on the source sites: 2 requests per hour per source -- matches
    # sources.yaml refresh_minutes: 30. The D1 free tier is not at risk:
    # a fuel_prices row is written ONLY when a price changes (ADR-004), so
    # most runs write one scrape_runs row and no price rows.
    - cron: "7,37 * * * *"
    # EV tariffs and the EU weekly bulletin once a day, NOT every 30 minutes:
    # the bulletin changes weekly, and the EV sources are large files (e-mobi
    # ~430KB, Ignitis ~530KB). Pulling them 48x a day would be pointless load
    # on other people's servers; tariffs do not change that often.
    - cron: "17 4 * * *"

# Never two collections at once; a new one waits for the running one.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Install collector
        working-directory: collector
        run: uv sync

      # A dispatched run follows its scope input; a scheduled run only runs the
      # part that belongs to its cron entry.
      - name: Run all fuel sources and push
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7,37 * * * *'
        working-directory: collector
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: uv run python -m collector run --all --push

      - name: Run EU weekly oil bulletin and push
        if: (github.event_name == 'workflow_dispatch' && inputs.scope != 'fuel') || github.event.schedule == '17 4 * * *'
        working-directory: collector
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: uv run python -m collector official-weekly --push

      - name: Run e-mobi EV stations/tariffs and push
        if: (github.event_name == 'workflow_dispatch' && inputs.scope != 'fuel') || github.event.schedule == '17 4 * * *'
        working-directory: collector
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: uv run python -m collector emobi-ev --push

      - name: Run Ignitis ON EV stations/tariffs and push
        if: (github.event_name == 'workflow_dispatch' && inputs.scope != 'fuel') || github.event.schedule == '17 4 * * *'
        working-directory: collector
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: uv run python -m collector ignitis-ev --push

      - name: Run Eleport EV tariffs and push
        if: (github.event_name == 'workflow_dispatch' && inputs.scope != 'fuel') || github.event.schedule == '17 4 * * *'
        working-directory: collector
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: uv run python -m collector eleport-ev --push

      - name: Run Virsi EV tariffs and push
        if: (github.event_name == 'workflow_dispatch' && inputs.scope != 'fuel') || github.event.schedule == '17 4 * * *'
        working-directory: collector
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: uv run python -m collector virsi-ev --push
